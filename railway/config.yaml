# Same policy as vps/config.yaml, with Railway's connection variables.
#
# NOTE: LiteLLM iterates quickly. If a key here is rejected on startup, check
# https://docs.litellm.ai/docs/proxy/configs — the shape below reflects the
# stable release at time of writing.

model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      # Half of your overshoot ceiling: the cost of one runaway request.
      max_tokens: 8000

  # R1. Tool calling is weaker; offered but not the default.
  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY
      max_tokens: 8000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Railway injects this from the Postgres service reference variable.
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true

  # Proxy-wide kill switch, independent of any student's budget.
  max_budget: 500
  budget_duration: 30d

  # Response caching stays OFF. Coding prompts are rarely byte-identical, so the
  # hit rate would be near zero, and a stale hit shared across two students is
  # painful to debug. Redis here is for rate limiting only.

router_settings:
  routing_strategy: simple-shuffle
  # Railway's Redis service exposes REDIS_URL. If your LiteLLM version wants
  # host/port instead, set REDIS_HOST and REDIS_PORT and swap this line for the
  # redis_host/redis_port pair used in ../vps/config.yaml.
  redis_url: os.environ/REDIS_URL
